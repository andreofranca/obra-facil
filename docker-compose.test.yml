services:
  postgres-test:
    image: postgres:16
    container_name: obrafacil-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: obrafacil_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
